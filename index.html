<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);font-size:var(--fs-base);background:var(--bg);min-height:100vh}
.container{margin:0 auto;padding:28px 20px 60px;max-width:var(--page-w);width:100%}
h1{font-size:var(--fs-h1);text-align:center;color:var(--fg);margin-bottom:6px;font-family:'Noto Serif TC','Songti TC',PMingLiU,serif;font-weight:700;letter-spacing:.5px}
.subtitle{text-align:center;color:var(--fg-soft);margin-bottom:8px;font-size:.92rem}
.sort-info{text-align:center;color:var(--fg-muted);font-size:.8rem;margin-bottom:20px;background:var(--accent);border-radius:8px;padding:7px 12px;border-left:3px solid var(--primary)}
.version-line{text-align:center;margin-bottom:14px}
.version-btn{background:var(--accent);color:var(--primary);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:.72rem;font-family:inherit;cursor:pointer;letter-spacing:.3px;transition:all .2s}
.version-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:center;padding:20px;z-index:100}
.modal-box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:18px 22px 12px;border-bottom:1px solid #eee}
.modal-head h3{color:var(--primary);font-size:1.05rem}
.modal-close{background:none;border:none;font-size:1.4rem;color:var(--fg-muted);cursor:pointer;line-height:1;padding:0 4px}
.modal-close:hover{color:var(--fg)}
.modal-body{padding:16px 22px 22px}
.cl-item{margin-bottom:18px}
.cl-ver{display:inline-block;background:var(--primary);color:#fff;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:10px}
.cl-ver.old{background:#bbb}
.cl-title{font-weight:600;color:var(--fg);font-size:.88rem;margin:6px 0 4px}
.cl-item ul{margin:0;padding-left:19px}
.cl-item li{color:var(--fg-soft);font-size:.83rem;line-height:1.65;margin-bottom:2px}
.login-box{max-width:360px;margin:0 auto}
.login-box input{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font-size:1rem;margin-bottom:12px;outline:none;transition:border .3s}
.login-box input:focus{border-color:var(--primary)}
.login-error{color:var(--danger);font-size:.85rem;margin-bottom:10px;display:none}
.upload-area{border:2px dashed var(--primary);border-radius:15px;padding:45px 20px;text-align:center;cursor:pointer;transition:all .3s;background:var(--muted);margin-bottom:16px}
.upload-area:hover,.upload-area.dragover{border-color:var(--primary-dark);background:var(--accent);transform:translateY(-2px)}
.upload-icon{font-size:3rem;margin-bottom:10px}
.badges{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.badge-pdf{background:#ffeaa7;color:var(--danger)}.badge-img{background:#dfe6e9;color:#636e72}
#fileInput{display:none}
.file-list{margin-top:16px}
.file-item{background:var(--muted);padding:12px 16px;border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
.btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s;margin-top:16px}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(45,107,61,.25)}
.btn:disabled{background:#ccc;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:transparent;color:var(--primary);border:2px solid var(--primary);margin-top:10px}
.btn-outline:hover{background:var(--primary);color:#fff}
.results{margin-top:24px}
.result-item{background:#fff;border-left:4px solid var(--primary);padding:16px;border-radius:10px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.result-filename{font-weight:600;color:var(--fg);font-size:.92rem}
.result-badge{background:var(--primary);color:#fff;padding:3px 12px;border-radius:16px;font-size:.78rem;font-weight:600}
.result-badge.error{background:#ff7675}
.token-tag{background:var(--muted);color:var(--fg-muted);padding:2px 9px;border-radius:12px;font-size:.72rem;margin-right:6px}
.order-card{background:var(--muted);padding:12px 14px;border-radius:8px;margin-bottom:8px;border-left:3px solid var(--primary-dark);font-size:.85rem}
.order-label{font-weight:600;color:var(--primary);min-width:150px;display:inline-block;vertical-align:top;padding-top:5px;font-size:.84rem}
.editable-field{background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:.85rem;font-family:inherit;width:calc(100% - 160px);display:inline-block;transition:border .2s}
.editable-field:focus{outline:none;border-color:var(--primary);background:var(--accent)}
.editable-field:hover{border-color:var(--fg-muted)}
.editable-field.is-empty{background:var(--warn-bg);border-color:var(--warn)}
.editable-field.is-empty:focus{background:#fff;border-color:var(--primary)}
.editable-field.is-invalid{background:#fdecee;border-color:var(--danger)}
.field-row{margin-bottom:6px}
.ragic-summary{background:var(--warn-bg);border-left:4px solid var(--warn);padding:14px 16px;border-radius:10px;margin-top:18px}
.ragic-summary h3{color:var(--primary-dark);font-size:.95rem;margin-bottom:10px}
.ragic-row{background:#fff;padding:8px 12px;border-radius:6px;margin-bottom:6px;font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ragic-row.warn{background:#fff1f0;border-left:3px solid var(--danger)}
.ragic-row .po{font-weight:700;color:var(--fg)}
.ragic-row .meta{color:var(--fg-soft);font-size:.8rem}
.ragic-row .count{background:var(--accent);color:var(--primary);padding:2px 8px;border-radius:10px;font-size:.78rem;font-weight:600}
.ragic-warn-text{color:var(--danger);font-size:.82rem;margin-top:8px}
.match-panel{margin:4px 0 8px 160px;font-size:.8rem}
.match-ocr{color:var(--fg-soft);padding:3px 0}
.match-ocr b{color:var(--fg);font-weight:600}
.match-alts{margin-top:4px}
.match-alt{display:block;width:100%;text-align:left;background:var(--muted);border:1px solid var(--border);border-radius:6px;padding:4px 9px;margin-bottom:3px;cursor:pointer;font-size:.79rem;font-family:inherit;color:var(--fg);transition:all .15s}
.match-alt:hover{background:var(--accent);border-color:var(--primary)}
.match-alt .sc{color:var(--gold);font-size:.74rem;margin-left:6px;font-family:Georgia,serif}
.match-alt .hist{color:var(--gold);font-size:.74rem;margin-left:4px}
.diff-hi{background:#f5e6c8;border-radius:2px;padding:0 2px;font-weight:600}
.editable-field.is-disputed{background:var(--warn-bg);border-color:var(--warn);border-width:2px}
.verify-tag{display:inline-block;margin-left:8px;font-size:.75rem;color:var(--primary-dark);cursor:pointer;background:var(--warn-bg);border:1px solid var(--border);border-radius:5px;padding:1px 8px}
.verify-tag:hover{background:var(--accent)}
.verify-summary{background:var(--warn-bg);border-left:4px solid var(--warn);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.82rem;color:var(--muted-fg)}
.verify-summary b{color:var(--fg)}
.verify-ok{background:#f6ffed;border-left-color:#52c41a;color:#237804}
.verify-toggle{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:var(--muted);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-top:16px;cursor:pointer;transition:all .2s}
.verify-toggle:hover{border-color:var(--primary);background:var(--muted)}
.verify-toggle input{width:16px;height:16px;cursor:pointer;accent-color:var(--primary)}
.vt-text{font-size:.88rem;font-weight:600;color:var(--fg)}
.vt-hint{font-size:.75rem;color:var(--fg-muted);flex-basis:100%;padding-left:24px}
.verify-toggle.on{border-color:var(--warn);background:var(--warn-bg)}
.verify-toggle.on .vt-text{color:var(--primary-dark)}
.loading{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.5);border-radius:50%;border-top-color:#fff;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none !important}
</style>
</head>

<div class="container">
  <h1>📄 OCR 訂單處理系統</h1>
  <p class="subtitle">PDF 訂購單辨識 ｜ 一般訂單 &amp; 合約品項 ｜ 多品項自動拆分</p>
  <p class="version-line" id="versionLine"></p>

  <div id="loginSection" class="hidden">
    <div class="login-box" style="margin-top:30px">
      <h3 style="text-align:center;color:var(--primary);margin-bottom:16px">🔒 請輸入密碼</h3>
      <input type="password" id="passwordInput" placeholder="密碼" autocomplete="off">
      <div class="login-error" id="loginError"></div>
      <button class="btn" id="loginBtn" onclick="doLogin()">登入</button>
    </div>
  </div>

  <div id="mainSection" class="hidden">
    <div class="sort-info">
      📋 <b>處理順序：</b>PDF 依頁面順序 ｜ 多檔案依檔名自然排序 (1 &lt; 2 &lt; 10)
    </div>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📤</div>
      <h3 style="color:var(--primary);font-weight:600">拖放 PDF 到這裡，或點擊選擇</h3>
      <p style="color:var(--fg-muted);font-size:.85rem;margin-top:4px">最多 20 個 PDF，單檔上限 20MB</p>
      <div class="badges">
        <span class="badge badge-pdf">📑 PDF</span>
      </div>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*,.pdf">

    <div class="file-list" id="fileList"></div>
    <label class="verify-toggle" id="verifyToggleWrap">
      <input type="checkbox" id="verifyToggle">
      <span class="vt-text">🔍 雙模型交叉驗證</span>
      <span class="vt-hint">再用一個較便宜的模型跑一次，標出兩邊不一致的欄位（辨識費用約多兩成）</span>
    </label>
    <button class="btn" id="previewBtn" disabled>📋 預覽辨識結果</button>
    <button class="btn btn-outline hidden" id="submitBtn">✅ 確認寫入 Google Sheet + Ragic</button>

    <div class="results" id="results"></div>

    <datalist id="productsDatalist"></datalist>

<script>
const $ = id => document.getElementById(id);
let selectedFiles = [], pendingOrders = [];
let customerList = [];  // Ragic 客戶清單 [{code, name, short_name, category}]
let productList = [];   // Ragic 商品清單 [{name, model, code, unit, category, price}]
let orderHistory = {};  // 客戶歷史訂購 {客戶編號: {品名: 次數}}
// Ragic 寫入必填：ragic_po + date + ragic_customer_code (客戶編號)
const REQUIRED_FOR_RAGIC = ['ragic_po', 'date', 'ragic_customer_code'];
const MAX_CANDIDATES = 3;   // 顯示幾個「其他相似候選」

// 廠商固定三家 + 常見 OCR 誤識別字容錯
const VENDOR_OPTIONS = [
  { value: '長洲醫療儀器有限公司', keywords: ['長洲','長州','长洲','长州'], firstChar: ['長','长'] },
  { value: '尚鋒工業有限公司',     keywords: ['尚鋒','尚峰','尚锋'],       firstChar: ['尚'] },
  { value: '靖展有限公司',         keywords: ['靖展','靖晨','静展','静晨'], firstChar: ['靖','静'] },
];

function guessVendor(text) {
  if (!text) return '';
  const s = String(text);
  for (const opt of VENDOR_OPTIONS) {
    if (opt.keywords.some(k => s.includes(k))) return opt.value;
  }
  // 首字 fallback (處理更嚴重的誤識別，例如「尚〇工業」)
  for (const opt of VENDOR_OPTIONS) {
    if (opt.firstChar.some(c => s.includes(c))) return opt.value;
  }
  return '';
}

// 欄位中文對照表
const FIELD_LABELS = {
  ragic_po:           '🟧 Ragic 訂單編號 (手動填)',

// Ragic 寫入用的欄位固定放最前面 (這幾格是你要確認/填寫的)
const RAGIC_FIELDS = ['ragic_po','ragic_customer_code','ragic_product_name'];

// OCR 欄位順序：依訂單類型排成跟紙本相近的閱讀動線
const FIELD_ORDER = {
  // 合約品項：先看單據識別資訊，再看品項規格
  contract: [
    'type','idx','hospital','loc','po_no','item_id','sign_no',
    'date','deadline','vendor','dept','user','ext',
    'material_id','brand','item','unit','qty','price','note',
    'total','warranty','order_total',
  ],
  // 一般訂單：先看誰下的單，再看買什麼、多少錢
  general: [
    'type','date','vendor','hospital','loc',
    'item','qty','unit','price','total','brand','deadline',
    'dept','user','ext','po_no','item_id','idx','warranty',
    'sign_no','material_id','note','order_total',
  ],
};

/** 依該筆訂單的類型決定欄位顯示順序 */
function displayFieldsFor(order) {
  const t = String(order?.type || '');
  const key = t.includes('合約') ? 'contract' : 'general';
  return RAGIC_FIELDS.concat(FIELD_ORDER[key]);
}

function openChangelog(current) {
  const body = CHANGELOG.map(c => `
    <div class="cl-item">
      <span class="cl-ver${c.v === current ? '' : ' old'}">v${c.v}</span>
      <div class="cl-title">${c.title}</div>
      <ul>${c.items.map(i => `<li>${i}</li>`).join('')}</ul>
    </div>`).join('');
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <h3>📋 版本更新紀錄</h3>
        <button type="button" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">${body}</div>
    </div>`;
  // 點遮罩或關閉鈕都能關掉
  mask.addEventListener('click', e => {
    if (e.target === mask || e.target.closest('.modal-close')) mask.remove();
  });
  document.body.appendChild(mask);
}

function showVersion(d) {
  if (!d || !d.version) return;
  const el = $('versionLine');
  if (el) el.innerHTML = `<button type="button" class="version-btn" id="versionBtn">v${d.version} · 更新內容</button>`;
  const btn = $('versionBtn');
  if (btn) btn.addEventListener('click', () => openChangelog(d.version));
}

async function checkAuth() {
  try {
    const r = await fetch('/auth/status');
    const d = await r.json();
    showVersion(d);
    if (!d.required || d.authenticated) { showMain(); return; }
    $('loginSection').classList.remove('hidden');
    $('passwordInput').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  } catch(e) { showMain(); }
}
async function doLogin() {
  const pw = $('passwordInput').value;
  if (!pw) return;
  const r = await fetch('/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw})});
  if (r.ok) { $('loginSection').classList.add('hidden'); showMain(); }
  else { $('loginError').textContent='密碼錯誤'; $('loginError').style.display='block'; }
}
function initVerifyToggle() {
  const cb = $('verifyToggle'), wrap = $('verifyToggleWrap');
  if (!cb || !wrap) return;
  // 記住上次的選擇 (存在瀏覽器本機，換裝置會重設)

  wrap.classList.toggle('on', cb.checked);
  cb.addEventListener('change', () => {

/**
 * 合約品項精準比對：用「公司 + 資材代碼」查商品資料表的結構化欄位。
 * 資材代碼是合約上的固定編號，命中即 100% 確定。
 * @returns {{products: Array, matchedCompany: boolean}} 候選商品清單
 */
function lookupByMaterialCode(vendorName, materialId) {
  const code = String(materialId || '').trim();
  if (!code || !productList.length) return { products: [], matchedCompany: false };

  const withCode = productList.filter(p => (p.material_code || '').trim() === code);
  if (!withCode.length) return { products: [], matchedCompany: false };

  // 先用「公司 + 代碼」嚴格比對 (使用者選的 B 方案)
  const company = guessVendorShort(vendorName);
  if (company) {
    const exact = withCode.filter(p => (p.contract_company || '').trim() === company);
    if (exact.length) return { products: exact, matchedCompany: true };
  }
  // 公司對不上 (OCR 廠商可能抓錯、或商品沒填公司) → 仍回傳代碼相符的，但標示未驗證公司
  return { products: withCode, matchedCompany: false };
}

// 廠商全名 → 短名 (長洲/尚鋒/靖展)，對應商品表的「合約品項-公司」欄位
function guessVendorShort(vendorName) {
  const full = guessVendor(vendorName);
  if (!full) return '';
  if (full.includes('長洲')) return '長洲';
  if (full.includes('尚鋒')) return '尚鋒';
  if (full.includes('靖展')) return '靖展';
  return '';
}

// 該客戶買過這個品名幾次 (0 = 沒買過)
function historyCount(customerCode, productName) {
  if (!customerCode || !productName) return 0;
  const bucket = orderHistory[String(customerCode).trim()];
  return bucket ? (bucket[productName] || 0) : 0;
}

function populateProductDatalist() {
  const dl = $('productsDatalist');
  if (!dl) return;
  dl.innerHTML = productList.map(p => {
    const label = p.model ? `${p.name} 〔${p.model}〕` : p.name;
    return `<option value="${String(label).replace(/"/g,'&quot;')}">`;
  }).join('');
}

// 從顯示字串取回產品名稱 (去掉「〔型號〕」尾巴)
function parseProductName(text) {
  if (!text) return '';
  return String(text).replace(/\s*〔[^〕]*〕\s*$/, '').trim();
}

function findProductByName(name) {
  if (!name) return null;
  return productList.find(p => p.name === name) || null;
}

// 正規化：全形→半形、去空白/標點、轉大寫，方便比對型號與品名
function normText(s) {
  if (!s) return '';
  return String(s)
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .toUpperCase()
    .replace(/[\s\-_/()（）［］\[\]、,，.。:：*#"'`]/g, '');
}

// 抽出型號樣式的 token (字母+數字混合，例如 UD-50、XK2000、A100)
function extractModelTokens(s) {
  if (!s) return [];
  const t = normText(s);
  const tokens = new Set();
  // 字母數字混合串 (至少含一個數字)
  const re = /[A-Z]*\d+[A-Z0-9]*/g;
  let m;
  while ((m = re.exec(t)) !== null) {
    if (m[0].length >= 2) tokens.add(m[0]);
  }
  return [...tokens];
}

// 中文 bigram 集合 (連續兩字)，用來算相似度
function bigrams(s) {
  const t = normText(s);
  const out = new Set();
  for (let i = 0; i < t.length - 1; i++) out.add(t.slice(i, i + 2));
  if (t.length === 1) out.add(t);
  return out;
}

// Dice 係數：2*交集 / (|A|+|B|)，回傳 0~1
function diceSim(a, b) {
  const A = bigrams(a), B = bigrams(b);
  if (!A.size || !B.size) return 0;
  let inter = 0;
  A.forEach(g => { if (B.has(g)) inter++; });
  return (2 * inter) / (A.size + B.size);
}

// 互斥屬性組：同組內出現不同值 = 不同商品 (例如不銹鋼車 ≠ 塑鋼車)
const EXCLUSIVE_ATTRS = [
  ['不銹鋼', '不鏽鋼', '塑鋼', '粉體', '烤漆', '鋁合金'],  // 材質
  ['單層', '二層', '兩層', '三層', '四層', '五層'],        // 層數
];

// 產品主體詞：品名的核心名詞，不同就是完全不同的東西
// (床頭「櫃」≠ 垃圾「桶」、藥杯「架」≠ 衛材「車」)
const CORE_NOUNS = [
  '推車','餐車','藥車','衛材車','治療車','護理車','工作車','車',
  '床頭櫃','置物櫃','櫃',
  '點滴架','屏風架','架',
  '垃圾桶','污物桶','桶',
  '診療床','診察床','病床','床',
  '椅','凳','桌','台','箱','盒','籃','盆','架子',
  '燈','鏡','機','器','儀','錶','計',
  '袋','布','罩','套','墊','枕',
  '管','針','鉗','剪','刀','盤','桿','梯','屏風','欄',
];

// 配件/服務詞：候選品名比 OCR 品名「多出」這些字，通常是配件或維修項目，
// 不是本體 (OCR「床頭櫃」不該對到「床頭櫃拉板」)
const ACCESSORY_WORDS = [
  '拉板','蓋板','踏板','面板','底板','層板','背板','側板',
  '零件','配件','修理','維修','更換','安裝','拆除','加工','改裝',
  '把手','扶手','輪子','腳墊','螺絲','螺母','墊片','插銷',
];

/**
 * 候選是否為 OCR 品項的「配件」而非本體。
 * 條件：候選品名含配件詞，但 OCR 品名沒有 → 你要的是本體，它是零件。
 * (OCR「不銹鋼床頭櫃」vs 候選「床頭櫃拉板」)
 */
function isAccessoryOf(ocrNameNorm, pNameNorm) {
  if (!ocrNameNorm || !pNameNorm) return false;
  return ACCESSORY_WORDS.some(w => {
    const nw = normText(w);
    return pNameNorm.includes(nw) && !ocrNameNorm.includes(nw);
  });
}

/** 從品名抽出產品主體詞 (最長匹配優先，回傳 null 表示無法判定) */
function extractCoreNoun(name) {
  const t = normText(name);
  if (!t) return null;
  // 去掉尺寸與型號雜訊，只留中文主體
  const zh = t.replace(/[A-Z0-9×X*.\/]+/g, '');
  for (const noun of CORE_NOUNS) {          // CORE_NOUNS 已按長度優先排序
    if (zh.includes(normText(noun))) return noun;
  }
  return null;
}

/** 兩個品名的產品主體詞是否互斥 (都判定得出來但不同 → true) */
function coreNounMismatch(a, b) {
  const na = extractCoreNoun(a), nb = extractCoreNoun(b);
  if (!na || !nb) return false;             // 判不出來就不罰
  if (na === nb) return false;
  // 同屬一個大類 (例如「藥車」與「推車」都是車) 就不算互斥
  const tailA = na.slice(-1), tailB = nb.slice(-1);
  return tailA !== tailB;
}

/**
 * 檢查兩個品名的互斥屬性是否衝突。
 * @returns {number} 衝突組數 (0 = 沒衝突)
 */
function attrConflicts(aNorm, bNorm) {
  let conflicts = 0;
  for (const group of EXCLUSIVE_ATTRS) {
    const inA = group.filter(k => aNorm.includes(normText(k)));
    const inB = group.filter(k => bNorm.includes(normText(k)));
    if (!inA.length || !inB.length) continue;
    // 兩邊都有此類屬性，但沒有任何交集 → 衝突
    if (!inA.some(k => inB.includes(k))) conflicts++;
  }
  return conflicts;
}

/**
 * 智慧比對商品：綜合型號、品名相似度、包含關係評分。
 * @returns {{product, score, reason}|null}  score 0~100
 */
function matchProduct(order, customerCode) {
  if (!productList.length) return null;
  const ocrName  = String(order.item || '').trim();
  const ocrModel = String(order.brand || '').trim();
  const custCode = customerCode || order.ragic_customer_code || '';

  // ⚡ 合約品項優先：資材代碼是合約固定編號，命中即 100% 確定
  const mat = lookupByMaterialCode(order.vendor, order.material_id);
  if (mat.products.length) {
    const codeTag = `資材碼 ${String(order.material_id).trim()}`;
    const companyTag = mat.matchedCompany ? '' : '（⚠公司未驗證）';
    if (mat.products.length === 1) {
      return { product: mat.products[0], score: 999,
               reason: `⚡${codeTag} 合約對應${companyTag}`, alternatives: [] };
    }
    // 一個代碼對到多個產品 → 依品名相似度排序，第一名為預設、其餘列為候選
    const ranked = mat.products
      .map(p => ({ product: p, sim: diceSim(ocrName || '', p.name) }))
      .sort((a, b) => b.sim - a.sim);
    return {
      product: ranked[0].product, score: 500,
      reason: `⚡${codeTag} 有 ${mat.products.length} 個產品，已選最相似${companyTag}`,
      alternatives: ranked.slice(1, MAX_CANDIDATES + 1)
        .map(r => ({ product: r.product, score: 500, times: 0, reason: '同資材代碼' })),
    };
  }

  if (!ocrName && !ocrModel) return null;

  const ocrNameNorm  = normText(ocrName);
  const ocrModelNorm = normText(ocrModel);
  // 型號 token 從 brand 與 item 兩邊都抓 (型號常混在品名裡)
  const ocrTokens = new Set([...extractModelTokens(ocrModel), ...extractModelTokens(ocrName)]);

  const candidates = [];
  for (const p of productList) {
    const pNameNorm  = normText(p.name);
    const pModelNorm = normText(p.model);
    let score = 0;
    const reasons = [];

    // 1. 品名完全相同 → 幾乎確定
    if (ocrNameNorm && pNameNorm === ocrNameNorm) {
      score += 100; reasons.push('品名完全相同');
    }
    // 2. 型號完全相同 → 很強的信號
    if (ocrModelNorm && pModelNorm && pModelNorm === ocrModelNorm) {
      score += 60; reasons.push('型號完全相同');
    }
    // 3. 型號/尺寸 token 交集
    //    商品庫多數沒填「廠牌型號」欄位，型號與尺寸都藏在產品名稱裡
    //    (例如「SF9074 二層車 70x50x85cm」)，所以兩邊都要抽
    if (ocrTokens.size) {
      const pTokens = new Set([...extractModelTokens(p.model), ...extractModelTokens(p.name)]);
      let hit = 0;
      ocrTokens.forEach(t => { if (pTokens.has(t)) hit++; });
      if (hit) { score += 35 * hit; reasons.push(`型號/尺寸相符 (${hit})`); }
    }
    // 4. 互相包含 (OCR 品名包含商品名，或反之)
    if (ocrNameNorm && pNameNorm) {
      if (ocrNameNorm.includes(pNameNorm) || pNameNorm.includes(ocrNameNorm)) {
        // 長度越接近，分數越高
        const ratio = Math.min(ocrNameNorm.length, pNameNorm.length) /
                      Math.max(ocrNameNorm.length, pNameNorm.length);
        score += 40 * ratio; reasons.push('品名包含關係');
      } else {
        // 去掉尺寸/型號後再比一次中文主體
        // (「開放式不銹鋼床頭櫃 20x30」應該對得到「不銹鋼床頭櫃 48x46x83cm」)
        const zhA = ocrNameNorm.replace(/[A-Z0-9×X*.\/]+/g, '');
        const zhB = pNameNorm.replace(/[A-Z0-9×X*.\/]+/g, '');
        if (zhA && zhB && (zhA.includes(zhB) || zhB.includes(zhA))) {
          const ratio = Math.min(zhA.length, zhB.length) / Math.max(zhA.length, zhB.length);
          score += 45 * ratio; reasons.push('品名主體包含');
        }
      }
    }
    // 5. 品名 bigram 相似度 (核心的模糊比對)
    if (ocrNameNorm && pNameNorm) {
      const sim = diceSim(ocrName, p.name);
      if (sim > 0.25) { score += sim * 50; reasons.push(`品名相似 ${(sim*100).toFixed(0)}%`); }
    }
    // 6. 互斥屬性衝突懲罰 (不銹鋼車 vs 塑鋼車、二層車 vs 三層車)
    if (ocrNameNorm && pNameNorm) {
      const conflicts = attrConflicts(ocrNameNorm, pNameNorm);
      if (conflicts) { score -= 45 * conflicts; reasons.push(`⚠材質/規格不符(-${45*conflicts})`); }
    }
    // 7. 產品主體詞：相同加分、不同重罰
    //    (床頭「櫃」vs 垃圾「桶」是完全不同的東西)
    const coreMismatch = coreNounMismatch(ocrName, p.name);
    if (coreMismatch) {
      score -= 90; reasons.push('⚠品類不符(-90)');
    } else {
      const nA = extractCoreNoun(ocrName), nB = extractCoreNoun(p.name);
      if (nA && nB && nA === nB) {
        // 多字核心詞辨識力強 (床頭櫃)，單字較弱 (架、車)
        const bonus = nA.length >= 2 ? 40 : 15;
        score += bonus; reasons.push(`品類相符「${nA}」`);
      }
    }

    // 7b. 配件懲罰：候選是本體的配件 (床頭櫃 → 床頭櫃拉板)，不是要的東西
    if (isAccessoryOf(ocrNameNorm, pNameNorm)) {
      score -= 60; reasons.push('⚠疑似配件(-60)');
    }

    // ── 以上為「基礎分數」：只看品名 + 型號 + 品類 ──
    const baseScore = score;

    // 8. 客戶歷史訂購：只當「決勝」用，不蓋過品名差異
    //    基礎分數接近時 (規格相似的客製品) 才靠買過幾次分高下
    let times = 0;
    if (baseScore >= 50 && !coreMismatch && custCode) {
      times = historyCount(custCode, p.name);
      if (times) {
        // 加成上限為基礎分的 15%，確保排序主要仍由品名/型號決定
        score += Math.min(baseScore * 0.15, 8 + times * 2);
        reasons.push(`⭐該客戶買過 ${times} 次`);
      }
    }

    if (score > 0) {
      candidates.push({ product: p, score, baseScore, times,
                        reason: reasons.join('、') });
    }
  }

  // 依最終分數排序，取前幾名當候選
  candidates.sort((a, b) => b.score - a.score);
  const top = candidates.filter(c => c.score >= 30).slice(0, MAX_CANDIDATES + 1);
  if (!top.length) return null;
  return { ...top[0], alternatives: top.slice(1) };
}

function productDisplay(p) {
  return p.model ? `${p.name} 〔${p.model}〕` : p.name;
}

const _ESC = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/**
 * 把 name 中「與 baseName 不同」的尺寸/型號片段反白，
 * 讓「70x50x85cm」vs「80x50x90cm」的差異一眼看出來。
 */
function highlightDiff(name, baseName) {
  const baseTokens = new Set(extractModelTokens(baseName));
  // 切出數字/尺寸片段 (含 x、. 等連接符) 與其餘文字
  return String(name).split(/([0-9]+(?:[.\-xX×*][0-9]+)*(?:\s*[a-zA-Z]{1,4})?)/g)
    .map(seg => {
      if (!/[0-9]/.test(seg)) return _ESC(seg);
      const norm = normText(seg);
      // 該片段在候選中「不存在於基準品名」→ 反白提示差異
      const isDiff = norm && ![...baseTokens].some(t => t === norm || t.includes(norm) || norm.includes(t));
      return isDiff ? `<span class="diff-hi">${_ESC(seg)}</span>` : _ESC(seg);
    }).join('');
}

/**
 * 品名比對輔助面板：OCR 原文並排 + 其他相似候選 (可點擊切換)。
 * 目的是讓你在這一頁就能確認選對規格，不必再開 Ragic 核對。
 */
function renderMatchPanel(order, orderIdx, matchedProduct) {
  const ocrItem  = String(order.item || '').trim();
  const ocrBrand = String(order.brand || '').trim();
  const ocrMat   = String(order.material_id || '').trim();
  const alts = order._alternatives || [];
  if (!ocrItem && !ocrBrand && !alts.length) return '';

  let html = '<div class="match-panel">';
  // OCR 原文並排，方便直接對照選中的商品
  const parts = [];
  if (ocrItem)  parts.push(`<b>${_ESC(ocrItem)}</b>`);
  if (ocrBrand) parts.push(`型號 ${_ESC(ocrBrand)}`);
  if (ocrMat)   parts.push(`資材碼 ${_ESC(ocrMat)}`);
  if (parts.length) {
    html += `<div class="match-ocr">OCR 原文：${parts.join(' ｜ ')}</div>`;
  }
  // 其他相似候選，尺寸差異反白
  if (alts.length) {
    const baseName = matchedProduct ? matchedProduct.name : ocrItem;
    html += '<div class="match-alts">';
    alts.forEach(a => {
      const p = a.product;
      const histTag = a.times ? `<span class="hist">⭐買過${a.times}次</span>` : '';
      html += `<button type="button" class="match-alt"
                 data-order-idx="${orderIdx}"
                 data-pick="${_ESC(p.name).replace(/"/g,'&quot;')}">
                 ⭕ ${highlightDiff(p.name, baseName)}
                 <span class="sc">(${Math.round(a.score)})</span>${histTag}
               </button>`;
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/** 分數 → [顏色, 文字, 圖示]。999=資材碼唯一命中、500=資材碼一對多 */
function confidenceLevel(score) {
  if (score >= 999) return ['#0a7', '合約代碼確認', '⚡'];
  if (score >= 500) return ['#c80', '合約代碼(需確認品項)', '⚡'];
  if (score >= 120) return ['#0a7', '信心高', '✓'];
  if (score >= 60)  return ['#c80', '信心中', '✓'];
  return ['#d63031', '信心低', '✓'];
}

/**
 * 客戶改變後，重新比對該 po_no 群組的商品 (吃新客戶的歷史訂購加權)。
 * 只覆寫「自動比對」的結果，使用者手動選過的保持不動。
 */
function rematchProductsForGroup(poNo, customerCode) {
  if (!poNo || !customerCode) return;
  document.querySelectorAll('.editable-field[data-field="ragic_product_name"]').forEach(input => {
    const idx = parseInt(input.dataset.orderIdx);
    const o = pendingOrders[idx];
    if (!o || (o.po_no || '').trim() !== poNo) return;
    if (o._user_picked_product) return;   // 使用者手選過，尊重他的選擇

    const hit = matchProduct(o, customerCode);
    const newName = hit ? hit.product.name : '';
    o.ragic_product_name = newName;
    o._match_score  = hit ? Math.round(hit.score) : 0;
    o._match_reason = hit ? hit.reason : '';
    o._alternatives = hit ? (hit.alternatives || []) : [];

    const p = hit ? hit.product : null;
    input.value = p ? productDisplay(p) : '';
    input.classList.toggle('is-empty', !p);
    if (p) input.classList.remove('is-invalid');
    // 更新旁邊的提示文字
    const hintEl = input.parentElement.querySelector('span:last-child');
    if (hintEl && hintEl !== input.previousElementSibling) {
      // 候選清單也要跟著換 (客戶/廠商變了，相似候選與歷史次數都會不同)
      const panel = input.closest('.field-row')?.nextElementSibling;
      if (panel && panel.classList.contains('match-panel')) {
        panel.outerHTML = renderMatchPanel(o, idx, p);
      }
      if (p) {
        const lvl = confidenceLevel(o._match_score);
        hintEl.style.color = lvl[0];
        hintEl.textContent = `${lvl[2]} ${lvl[1]} (${o._match_score}) ${o._match_reason || ''}`;
      } else {
        hintEl.style.color = '#c80';
        hintEl.textContent = `未自動比對到，請搜尋選擇 (OCR: ${o.item || '—'})`;
      }
    }
  });
}

// 模糊比對單一字串 → 客戶清單，找最匹配的客戶編號 (空字串=找不到)
function matchCustomerByText(text) {
  if (!text || !customerList.length) return '';
  const t = String(text).trim();
  if (!t) return '';
  // 1. 完整名稱完全相等
  let m = customerList.find(c => c.name === t);
  if (m) return m.code;
  // 2. 簡稱完全相等
  m = customerList.find(c => c.short_name === t);
  if (m) return m.code;
  // 3. 輸入字串包含簡稱 (例如「3F 麻醉科 林新醫院」包含「林新醫院」)
  m = customerList.find(c => c.short_name && t.includes(c.short_name));
  if (m) return m.code;
  // 4. 輸入字串包含完整名稱
  m = customerList.find(c => c.name && t.includes(c.name));
  if (m) return m.code;
  // 5. 客戶簡稱包含輸入字串 (輸入較短時)
  m = customerList.find(c => c.short_name && c.short_name.includes(t));
  if (m) return m.code;
  return '';
}

// 根據 OCR 結果猜客戶編號：loc (交貨地點) 優先，找不到才用 hospital fallback
function guessCustomerCode(order) {
  if (!order) return '';
  return matchCustomerByText(order.loc) || matchCustomerByText(order.hospital);
}

function findCustomer(code) {
  return customerList.find(c => c.code === code);
}

function naturalSort(a, b) {
  const re=/(\d+)/g, ap=a.name.toLowerCase().split(re), bp=b.name.toLowerCase().split(re);
  for(let i=0;i<Math.max(ap.length,bp.length);i++){
    const av=ap[i]||'',bv=bp[i]||'',an=parseInt(av),bn=parseInt(bv);
    if(!isNaN(an)&&!isNaN(bn)&&an!==bn)return an-bn;
    if(av!==bv)return av<bv?-1:1;
  }
  return 0;
}

function handleFiles(files) {
  let arr = Array.from(files);
  if(arr.length>20){alert('最多 20 個檔案');arr=arr.slice(0,20);}

function collectEdits() {
  document.querySelectorAll('.editable-field').forEach(input => {
    const idx = parseInt(input.dataset.orderIdx);
    const field = input.dataset.field;
    const val = input.value.trim();
    if (!pendingOrders[idx]) return;

    if (field === 'ragic_customer_code') {
      // 從顯示字串「35 林新醫院 (醫院)」解析出客戶編號
      const code = parseCustomerCode(val);
      const customer = findCustomer(code);
      pendingOrders[idx].ragic_customer_code = customer ? code : '';
      pendingOrders[idx].ragic_customer_category = customer ? customer.category : '';
    } else if (field === 'ragic_product_name') {
      // 從顯示字串「電腦架加固定架 〔UD-50〕」解析出產品名稱
      const pname = parseProductName(val);
      const valid = !!findProductByName(pname);
      // 使用者手動改過且有效 → 標記，避免客戶變更時被自動重算覆蓋
      if (valid && pname !== pendingOrders[idx].ragic_product_name) {
        pendingOrders[idx]._user_picked_product = true;
      }
      pendingOrders[idx].ragic_product_name = valid ? pname : '';
    } else if (['qty', 'price', 'total', 'order_total', 'warranty'].includes(field)) {
      pendingOrders[idx][field] = val ? parseFloat(val) || 0 : 0;
    } else {
      pendingOrders[idx][field] = val;
    }
  });
}

function validateRequired() {
  // 清掉舊的紅框
  document.querySelectorAll('.editable-field.is-invalid').forEach(el => el.classList.remove('is-invalid'));
  const missing = [];
  document.querySelectorAll('.editable-field').forEach(input => {
    const field = input.dataset.field;
    if (!REQUIRED_FOR_RAGIC.includes(field)) return;
    const val = String(input.value).trim();
    let invalid = false;
    if (field === 'ragic_customer_code') {
      // 必須能對應到客戶清單，不只是非空字串
      const code = parseCustomerCode(val);
      if (!findCustomer(code)) invalid = true;
    } else {
      if (!val) invalid = true;
    }
    if (invalid) {
      input.classList.add('is-invalid');
      missing.push({field, input});
    }
  });
  return missing;
}

function renderRagicSummary() {
  const box = $('ragicSummary');
  if (!pendingOrders.length) { box.innerHTML = ''; return; }
  // 用 po_no 分組 (OCR 穩定識別)，主表訂單編號 (1000320) 從每組第一個有值的 ragic_po 取
  const groups = {};
  pendingOrders.forEach(o => {
    const po = (o.po_no || '').trim();
    if (!po) return;
    (groups[po] = groups[po] || []).push(o);
  });
  const poList = Object.keys(groups);
  const noPo = pendingOrders.filter(o => !(o.po_no || '').trim()).length;
  if (!poList.length && !noPo) { box.innerHTML = ''; return; }

  let html = `<div class="ragic-summary"><h3>📋 將寫入 Ragic 的訂單 (按 po_no 分組)</h3>`;
  poList.forEach(po => {
    const items = groups[po];
    const h = items[0];
    const ragicPo = (items.find(it => (it.ragic_po || '').trim())?.ragic_po || '').trim();
    const custCode = (items.find(it => (it.ragic_customer_code || '').trim())?.ragic_customer_code || '').trim();
    const custObj = findCustomer(custCode);

    const ragicPoDisplay = ragicPo
      ? `<span class="po">${ragicPo}</span>`
      : `<span style="color:#d63031">⚠ 未填 Ragic 訂單編號</span>`;
    const dateBad = !h.date ? ' <span style="color:#d63031">(缺日期)</span>' : '';

    let custLine;
    if (custObj) {
      const taxPct = custObj.category === '醫院' ? '0%' : '5%';
      custLine = `客戶：<b>${custCode}</b> ${custObj.short_name || custObj.name} (${custObj.category}) · 營業稅 <b>${taxPct}</b>`;
    } else if (custCode) {
      custLine = `<span style="color:#d63031">⚠ 客戶清單找不到 "${custCode}"，連結會以純文字存，營業稅 5%</span>`;
    } else {
      custLine = `<span style="color:#d63031">⚠ 未選客戶</span>`;
    }

    html += `<div class="ragic-row">
      <div>
        <div>${ragicPoDisplay} <span class="meta">(po_no: ${po})</span>${dateBad}</div>
        <div class="meta">${h.date || '？'} ｜ ${h.vendor || '—'}</div>
        <div class="meta">${custLine}</div>
      </div>
      <span class="count">${items.length} 個品項</span>
    </div>`;
  });
  if (noPo) {
    html += `<div class="ragic-row warn"><div>⚠️ 有 ${noPo} 筆品項 OCR 沒抓到 po_no</div><span class="meta">將跳過 Ragic，仍寫入 Sheet</span></div>`;
  }
  html += `<div class="ragic-warn-text">寫入規則：同 po_no 合併為一筆 Ragic 訂單；訂單編號用「Ragic 訂單編號」；客戶編號用下拉選的客戶；營業稅依客戶類別 (醫院 0%、其他 5%)；已存在的訂單編號會自動跳過。</div></div>`;
  box.innerHTML = html;
}

function formatRagicResultMsg(d) {
  let msg = `✅ Google Sheet: 已寫入 ${d.rows_written} 行\n\n`;
  if (!d.ragic) { msg += '📋 Ragic: 未啟用'; return msg; }
  if (!d.ragic.enabled) { msg += '📋 Ragic: 已停用 (RAGIC_ENABLED=false)'; return msg; }
  if (!d.ragic.configured) { msg += '📋 Ragic: 未設定 API Key，已跳過'; return msg; }
  const s = d.ragic.summary;
  msg += `📋 Ragic 結果：新增 ${s.success} 筆、跳過 ${s.skipped} 筆、失敗 ${s.error} 筆`;
  if (typeof s.attachments === 'number') msg += `；附件上傳 ${s.attachments} 個`;
  if (s.no_po) msg += `\n   (有 ${s.no_po} 筆品項缺訂單號，未送 Ragic)`;
  if (d.ragic.results && d.ragic.results.length) {
    const lines = d.ragic.results.map(r => {
      const tag = r.status === 'success' ? '✓' : (r.status === 'skipped' ? '○' : '✗');
      const extra = r.message ? ` — ${r.message}` : '';
      const link = r.view_url ? `\n      ${r.view_url}` : '';
      // 顯示實際查詢用的 ragic_po (若與 po_no 不同)，方便追查為何被判重複
      const ragicPoTag = (r.ragic_po && r.ragic_po !== r.po_no)
        ? ` [查詢用編號: ${r.ragic_po}]`
        : '';
      return `   ${tag} ${r.po_no}${ragicPoTag} (${r.items} 品項)${extra}${link}`;
    });
    msg += '\n' + lines.join('\n');
    msg += '\n\n💡 點擊跳過的紀錄連結可確認是否真的是同一筆訂單。若 [查詢用編號] 跟 po_no 不同，那就是你在「Ragic 訂單編號」欄位填的值。';
  }
  return msg;
}

let lastResults = [];

function displayResults(resultsData, showSubmit) {
  lastResults = resultsData;
  const el = $('results');
  el.innerHTML = '<h2 style="color:var(--primary);margin-bottom:16px">📊 辨識結果（可直接點擊修改）</h2>';

  let globalIdx = 0;
  resultsData.forEach(r => {

    } else {
      const orders = r.orders||[];
      // 雙模型驗證：把不一致的欄位掛到每筆 order 上
      const rDiffs = r.diffs || [];
      orders.forEach((o, oi) => { o._diff = rDiffs[oi] || {}; });
      // 初始化新欄位：ragic_po 預設空、ragic_customer_code 預設用 hospital 模糊匹配
      // vendor 用 3 選項標準化 (含 OCR 誤識別容錯)
      orders.forEach(o => {
        if (o.ragic_po === undefined) o.ragic_po = '';
        if (o.ragic_customer_code === undefined) {
          o.ragic_customer_code = guessCustomerCode(o);
        }
        const c = findCustomer(o.ragic_customer_code);
        o.ragic_customer_category = c ? c.category : '';
        // 廠商標準化：OCR 抓的字串 → 三個固定選項之一 (找不到就留 OCR 原文讓使用者選)
        const guessedVendor = guessVendor(o.vendor);
        if (guessedVendor) o.vendor = guessedVendor;
        // 商品智慧比對：客戶歷史 + 型號 + 品名相似度
        // (客戶已在上面決定，這裡才能吃到歷史加權)
        if (o.ragic_product_name === undefined) {
          const hit = matchProduct(o, o.ragic_customer_code);
          o.ragic_product_name  = hit ? hit.product.name : '';
          o._match_score  = hit ? Math.round(hit.score) : 0;
          o._match_reason = hit ? hit.reason : '';

            const inputCls = (!matched ? 'is-empty' : '');

              ${taxHint}
            </div>`;
          } else if (k === 'ragic_product_name') {
            // 商品智慧比對：input + datalist，可搜尋品名或型號
            const curName = String(val);
            const matched = findProductByName(curName);
            const inputVal = matched ? productDisplay(matched) : curName;
            const score = o._match_score || 0;
            let hint = '';
            if (matched) {
              const lvl = confidenceLevel(score);
              hint = `<span style="color:${lvl[0]};font-size:.78rem;margin-left:8px">${lvl[2]} ${lvl[1]} (${score}) ${o._match_reason || ''}</span>`;
            } else if (curName) {
              hint = `<span style="color:#d63031;font-size:.78rem;margin-left:8px">⚠ 商品庫找不到，請搜尋選擇</span>`;
            } else {
              hint = `<span style="color:#c80;font-size:.78rem;margin-left:8px">未自動比對到，請搜尋選擇 (OCR: ${(o.item||'—')})</span>`;
            }
            ordersHTML += `<div class="field-row">
              <span class="order-label">${label}:</span>
              <input type="text" class="editable-field ${matched ? '' : 'is-empty'}"
                     list="productsDatalist"
                     value="${String(inputVal).replace(/"/g,'&quot;')}"
                     data-order-idx="${globalIdx}" data-field="${k}"
                     placeholder="輸入品名或型號搜尋">
              ${hint}
            </div>
            ${renderMatchPanel(o, globalIdx, matched)}`;
          } else if (k === 'vendor') {
            // 廠商 3 選 1 下拉
            const curVal = String(val);
            const isMatched = VENDOR_OPTIONS.some(opt => opt.value === curVal);
            let opts = `<option value="">— 請選廠商 —</option>`;
            VENDOR_OPTIONS.forEach(opt => {
              const sel = opt.value === curVal ? ' selected' : '';
              opts += `<option value="${opt.value}"${sel}>${opt.value}</option>`;
            });
            const inputCls = (!isMatched ? 'is-empty' : '');
            const hint = (curVal && !isMatched)
              ? `<span style="color:#d63031;font-size:.78rem;margin-left:8px">⚠ OCR 抓到「${curVal}」對不到 3 家，請手動選</span>`
              : '';
            ordersHTML += `<div class="field-row">
              <span class="order-label">${label}:</span>
              <select class="editable-field ${inputCls}"
                      data-order-idx="${globalIdx}" data-field="${k}">${opts}</select>
              ${hint}
            </div>`;
          } else {
            // 雙模型驗證：這個欄位兩邊看法不同 → 標黃並附上驗證模型的答案
            const dv = (o._diff || {})[k];
            const disputed = dv !== undefined;
            const vTag = disputed
              ? `<span class="verify-tag" data-order-idx="${globalIdx}" data-field="${k}"
                       data-val="${String(dv).replace(/"/g,'&quot;')}"
                       title="點一下改用驗證模型的答案">驗證模型: ${_ESC(dv) || '(空)'}</span>`
              : '';
            ordersHTML += `<div class="field-row">
              <span class="order-label">${label}:</span>
              <input type="text" class="editable-field${isEmpty ? ' is-empty' : ''}${disputed ? ' is-disputed' : ''}"
                     value="${String(val).replace(/"/g,'&quot;')}"
                     data-order-idx="${globalIdx}" data-field="${k}"
                     ${isEmpty ? 'placeholder="（未抓到，請補）"' : ''}>
              ${vTag}
            </div>`;
          }
        });

        ordersHTML += `</div>`;
        globalIdx++;
      });

      const tk = r.tokens || {};
      const tkTag = (tk.input || tk.output)
        ? `<span class="token-tag" title="本次 Gemini OCR 的 token 用量">${(tk.input||0).toLocaleString()} in / ${(tk.output||0).toLocaleString()} out</span>`
        : '';
      // 驗證摘要：這份檔案有幾個欄位兩個模型看法不同
      let vSummary = '';
      if (r.verify_model) {
        const nDiff = rDiffs.reduce((a, d) => a + Object.keys(d || {}).length, 0);
        vSummary = nDiff
          ? `<div class="verify-summary">🔍 雙模型交叉驗證：有 <b>${nDiff}</b> 個欄位兩邊看法不同，已用黃框標出。點「驗證模型」標籤可改用它的答案。</div>`
          : `<div class="verify-summary verify-ok">✅ 雙模型交叉驗證：全部欄位一致，可放心送出。</div>`;
      }
      div.innerHTML = `<div class="result-header"><span class="result-filename">✅ ${r.filename}</span><span>${tkTag}<span class="result-badge">${r.items_count} 品項</span></span></div>${vSummary}${ordersHTML}`;
    }
    el.appendChild(div);
  });

  if(showSubmit && pendingOrders.length) {
    $('submitBtn').classList.remove('hidden');
    $('submitBtn').textContent = `✅ 確認寫入 ${pendingOrders.length} 筆 (Google Sheet + Ragic)`;
  }

  // 編輯到會影響 Ragic 摘要的欄位時自動重算
  const watchFields = new Set(['po_no','date','vendor','loc','ragic_po','ragic_customer_code','type']);
  document.querySelectorAll('.editable-field').forEach(input => {
    input.addEventListener('input', () => {
      const field = input.dataset.field;
      const idx = parseInt(input.dataset.orderIdx);
      const myPo = (pendingOrders[idx]?.po_no || '').trim();
      const newVal = input.value;

      // ragic_po / ragic_customer_code / vendor: 同 po_no 群組內自動同步
      if ((field === 'ragic_po' || field === 'ragic_customer_code' || field === 'vendor') && myPo) {
        document.querySelectorAll(`.editable-field[data-field="${field}"]`).forEach(other => {
          if (other === input) return;
          const otherIdx = parseInt(other.dataset.orderIdx);
          const otherPo = (pendingOrders[otherIdx]?.po_no || '').trim();
          if (otherPo === myPo && other.value !== newVal) {
            other.value = newVal;
            if (String(newVal).trim()) other.classList.remove('is-empty', 'is-invalid');
            else other.classList.add('is-empty');
            // 同步 pendingOrders 對應欄位 (供 collectEdits 使用)
            if (pendingOrders[otherIdx]) pendingOrders[otherIdx][field] = newVal;
          }
        });
      }

      // ragic_customer_code: 解析顯示字串成編號 + 自動更新對應的 ragic_customer_category
      if (field === 'ragic_customer_code') {
        const code = parseCustomerCode(newVal);
        const matched = findCustomer(code);
        const newCat = matched ? matched.category : '';
        pendingOrders[idx].ragic_customer_code = matched ? code : '';
        pendingOrders[idx].ragic_customer_category = newCat;
        // 同 po_no 群組同步 (pendingOrders 中存編號，DOM 中存顯示字串)
        if (myPo) {
          pendingOrders.forEach((o, i) => {
            if (i !== idx && (o.po_no || '').trim() === myPo) {
              o.ragic_customer_code = matched ? code : '';
              o.ragic_customer_category = newCat;
            }
          });
        }
        // ⭐ 客戶變了 → 該群組的商品重新比對 (吃該客戶的歷史訂購加權)
        if (matched) rematchProductsForGroup(myPo, code);
      }

      // 廠商變了 → 重新比對 (資材代碼用「公司+代碼」，公司改了結果會不同)
      if (field === 'vendor' && myPo) {
        const cust = pendingOrders[idx].ragic_customer_code || '';
        rematchProductsForGroup(myPo, cust);
      }

      // 訂單類型改了 → 欄位顯示順序不同，整份重新渲染
      if (field === 'type') {
        collectEdits();
        const snapshot = pendingOrders.slice();
        pendingOrders = [];
        displayResults(lastResults, true);
        // 保留使用者已編輯的內容
        snapshot.forEach((o, i) => { if (pendingOrders[i]) Object.assign(pendingOrders[i], o); });
        collectEdits();
        renderRagicSummary();
        return;
      }
      if (!watchFields.has(field)) return;
      collectEdits();
      renderRagicSummary();
    });
    input.addEventListener('blur', () => {
      if (REQUIRED_FOR_RAGIC.includes(input.dataset.field) && String(input.value).trim()) {
        input.classList.remove('is-invalid');
      }
    });
  });

  collectEdits();
  renderRagicSummary();
}

// 點擊「其他相似候選」→ 切換該筆品名。
// 用事件委派，這樣候選面板重繪後 (換客戶/廠商) 仍然有效。
// 點「驗證模型」標籤 → 採用驗證模型的答案
$('results').addEventListener('click', e => {
  const tag = e.target.closest('.verify-tag');
  if (!tag) return;
  const idx = parseInt(tag.dataset.orderIdx);
  const field = tag.dataset.field;
  const input = document.querySelector(
    `.editable-field[data-order-idx="${idx}"][data-field="${field}"]`);
  if (!input) return;
  input.value = tag.dataset.val || '';
  input.classList.remove('is-disputed');
  input.dispatchEvent(new Event('input', { bubbles: true }));
  tag.remove();
  collectEdits();
  renderRagicSummary();
});

$('results').addEventListener('click', e => {
  const btn = e.target.closest('.match-alt');
  if (!btn) return;
  const idx = parseInt(btn.dataset.orderIdx);
  const p = findProductByName(btn.dataset.pick);
  if (!p || !pendingOrders[idx]) return;
  const input = document.querySelector(
    `.editable-field[data-field="ragic_product_name"][data-order-idx="${idx}"]`);
  if (input) {
    input.value = productDisplay(p);
    input.classList.remove('is-empty', 'is-invalid');
  }
  pendingOrders[idx].ragic_product_name = p.name;
  pendingOrders[idx]._user_picked_product = true;   // 手選過，不被自動重算覆蓋
  collectEdits();
  renderRagicSummary();
});

checkAuth();
</script>
</body>
</html>
